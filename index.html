<!doctype html>
<html lang="ja">
<head>
<!-- 文字化けを防ぐ設定 -->
<meta charset="utf-8">
<!-- スマホの画面幅に合わせて表示する設定 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホールデム ハンドログ</title>
<!-- 文字の見た目（フォント）を読み込む -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  /* ============================================
     色の設定（明るいテーマ）
     ============================================ */
  :root {
    color-scheme: light;
    --bg: #eef2ef;          /* 背景 */
    --surface: #ffffff;     /* カードや枠の中 */
    --ink: #17211c;         /* 文字 */
    --muted: #5f6d66;       /* 薄い文字 */
    --line: #d5ddd8;        /* 区切り線 */
    --felt: #145c45;        /* 選択中（フェルトの緑） */
    --felt-soft: #dcebe4;   /* 選択中の薄い背景 */
    --aggr: #c0561e;        /* ベット・レイズ（攻めのアクション） */
    --aggr-ink: #ffffff;
    --warn: #b3261e;        /* 注意メッセージ */
    /* 4色デッキのスート色 */
    --spade: #17211c;
    --heart: #cf2f3b;
    --diamond: #1f63c6;
    --club: #2f8a3c;
    --font-jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    --font-num: "Barlow Condensed", "Arial Narrow", sans-serif;
    --font-mono: "JetBrains Mono", "Consolas", monospace;
  }

  /* 色の設定（暗いテーマ：スマホがダークモードのとき） */
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0e1411; --surface: #18211c; --ink: #e5ece8; --muted: #9aa8a0;
      --line: #2a3630; --felt: #4fbf8a; --felt-soft: #1d3a2d;
      --aggr: #e8793c; --aggr-ink: #1a0f08; --warn: #ff8a80;
      --spade: #e5ece8; --heart: #ff6b76; --diamond: #6aa5ff; --club: #5fcf6e;
    }
  }

  /* ============================================
     全体のレイアウト
     ============================================ */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-jp);
    font-size: 15px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 0 380px; /* 下に固定したボタン群に隠れないよう余白を取る */
    -webkit-text-size-adjust: 100%;
  }
  /* アクション入力をたたんでいるときは、下の余白を小さくする */
  body.pad-min { padding-block-end: 150px; }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }

  /* 上部に固定：今のストリートとポット */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    margin-inline: -16px; padding: 10px 16px;
    background: var(--bg); border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  .street { font-family: var(--font-num); font-weight: 700; font-size: 22px; letter-spacing: .06em; }
  .blinds { color: var(--muted); font-size: 13px; }
  .pot { font-family: var(--font-num); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pot small { font-size: 13px; color: var(--muted); font-family: var(--font-jp); font-weight: 500; margin-right: 4px; }

  .note {
    font-size: 12.5px; color: var(--muted); margin: 0;
    border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px;
  }

  /* 各ブロック（設定・ヒーロー・ボード…） */
  section { display: grid; gap: 8px; }
  h2 {
    font-size: 12px; font-weight: 700; color: var(--muted);
    letter-spacing: .12em; margin: 0;
  }
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; display: grid; gap: 12px;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .label { font-size: 13px; color: var(--muted); min-width: 5.5em; }
  .label.pos-name { font-family: var(--font-num); font-size: 17px; font-weight: 700; color: var(--ink); min-width: 3.5em; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 0; }

  /* ボタンの基本形 */
  button {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px;
    min-height: 40px; padding: 0 12px; cursor: pointer;
  }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--felt); outline-offset: 2px; }
  button.on { background: var(--felt); border-color: var(--felt); color: var(--surface); font-weight: 700; }

  /* 選択肢を横に並べたボタン（人数・アンティ） */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); min-width: 3.2em; }
  .seg button:last-child { border-right: 0; }

  input[type="number"] {
    font-family: var(--font-num); font-size: 18px; font-variant-numeric: tabular-nums;
    width: 6.5em; min-height: 40px; padding: 0 8px;
    color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  input:disabled { opacity: .4; }

  /* ポジションのボタン */
  .pos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pos button { font-family: var(--font-num); font-size: 16px; font-weight: 600; padding: 0; }

  /* トランプのカード */
  .cards { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .card {
    width: 46px; height: 62px; border-radius: 7px;
    background: var(--surface); border: 1.5px solid var(--line);
    display: grid; place-items: center; line-height: 1;
    font-family: var(--font-num); font-weight: 700; font-size: 24px;
  }
  button.card { min-height: 62px; padding: 0; }
  .card span { display: block; font-size: 18px; margin-top: -4px; }
  .card.empty { border-style: dashed; color: var(--muted); font-size: 12px; font-family: var(--font-jp); font-weight: 500; }
  .card.target { border-color: var(--felt); box-shadow: 0 0 0 2px var(--felt); }
  .board-gap { width: 6px; }
  .s { color: var(--spade); } .h { color: var(--heart); } .d { color: var(--diamond); } .c { color: var(--club); }
  .x { color: var(--muted); }  /* 色（マーク）不明 */
  .hint.warn { color: var(--warn); font-weight: 700; }
  button.muck { min-height: 62px; font-size: 13px; }

  /* アクション履歴 */
  .log { display: grid; gap: 4px; }
  .log-head {
    display: flex; justify-content: space-between; gap: 8px;
    font-family: var(--font-num); font-weight: 600; font-size: 15px; letter-spacing: .06em; color: var(--muted);
    margin-top: 6px;
  }
  .log-head:first-child { margin-top: 0; }
  .log-head .mini { letter-spacing: 0; margin-left: 6px; font-weight: 700; }
  .log-head b { font-variant-numeric: tabular-nums; }
  .act { display: flex; gap: 8px; align-items: baseline; font-variant-numeric: tabular-nums; }
  .act .who { font-family: var(--font-num); font-weight: 700; font-size: 16px; width: 3em; }
  .act .who.hero { color: var(--felt); }
  .act.auto { font-size: 12.5px; color: var(--muted); }
  .tag { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); }
  .tag.aggr { background: var(--aggr); border-color: var(--aggr); color: var(--aggr-ink); }
  .act .amt { font-family: var(--font-num); font-size: 16px; }
  .empty-log { margin: 0; font-size: 13px; color: var(--muted); }

  /* 記録テキスト（コピーする部分） */
  pre {
    margin: 0; padding: 12px; overflow-x: auto;
    font-family: var(--font-mono); font-size: 13px; line-height: 1.55;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  .primary { background: var(--felt); color: var(--surface); border-color: var(--felt); font-weight: 700; }
  .copy-msg { font-size: 12.5px; color: var(--felt); }

  /* ============================================
     画面の下に固定する部分（アクション入力・カード選択）
     ============================================ */
  .pad {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 10px 16px 12px;
    box-shadow: 0 -6px 18px rgb(0 0 0 / .08);
  }
  .pad-in { max-width: 560px; margin: 0 auto; display: grid; gap: 8px; }
  .pad-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pad-top button { min-height: 34px; font-size: 13px; }
  .pad-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .pad-body { display: grid; gap: 8px; }
  /* 入力し忘れを知らせるボタン（押すとカード選択が開く） */
  .shortcuts { display: grid; gap: 6px; }
  .shortcuts:empty { display: none; }
  .shortcuts button { width: 100%; min-height: 40px; font-weight: 700; font-size: 14px; }
  .shortcuts .need-hero { color: var(--warn); border-color: var(--warn); }
  .shortcuts .need-board { color: var(--felt); border-color: var(--felt); }
  .turn { font-size: 13px; color: var(--muted); }
  .turn b { color: var(--ink); font-family: var(--font-num); font-size: 18px; margin-right: 4px; }
  .who-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .who-row .who-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .who-row button { min-height: 36px; padding: 0 9px; font-family: var(--font-num); font-size: 16px; font-weight: 600; }
  .acts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .acts button { min-height: 48px; font-weight: 700; padding: 0; font-size: 14px; line-height: 1.15; }
  .acts button small { display: block; font-family: var(--font-num); font-size: 13px; font-weight: 600; }
  .acts .aggr { background: var(--aggr); border-color: var(--aggr); color: var(--aggr-ink); }
  .acts .aggr.pending { box-shadow: 0 0 0 3px var(--ink); }
  .sizes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .sizes button { min-height: 36px; font-size: 13px; padding: 0; }
  .amount-row { display: flex; gap: 8px; align-items: center; }
  .amount-row input { flex: 1; width: auto; min-width: 0; }
  .amount-row .bb { font-family: var(--font-num); font-size: 15px; color: var(--muted); min-width: 4em; }
  .amount-row button { min-width: 5em; }
  .msg { font-size: 12.5px; color: var(--warn); }
  .msg:empty { display: none; }

  /* カード選択（画面下） */
  .ranks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .ranks button { font-family: var(--font-num); font-size: 19px; font-weight: 600; padding: 0; min-height: 42px; }
  .suits { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .suits button { font-size: 24px; min-height: 46px; }
  /* HEROの手札を選ぶときに出すポジションの列（1列に並べる） */
  .sheet-pos-wrap { display: grid; gap: 4px; }
  .sheet-pos { display: grid; gap: 4px; }
  .sheet-pos button { font-family: var(--font-num); font-size: 15px; font-weight: 600; padding: 0; min-height: 38px; }
  .sheet-pos-wrap.need .sheet-pos { outline: 2px solid var(--warn); outline-offset: 2px; border-radius: 8px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- ============================================
     ここから画面の中身
     （中身の多くは、下の <script> が自動で書き込む）
     ============================================ -->

<!-- 上部：今のストリートとポット -->
<header class="topbar">
  <div>
    <div class="street" id="street">PREFLOP</div>
    <div class="blinds" id="summary"></div>
  </div>
  <div class="pot"><small>ポット</small><span id="pot">0</span></div>
</header>

<main class="wrap">
  <p class="note">Step 3：リバー・ショーダウンまで入力できます。再読み込みすると入力は消えます（Step 5 で保存できるようにします）。</p>

  <!-- ① 卓の設定 -->
  <section>
    <h2>卓の設定</h2>
    <div class="panel">
      <div class="row">
        <span class="label">人数</span>
        <div class="seg">
          <button type="button" data-seats="6">6人</button>
          <button type="button" data-seats="7">7人</button>
          <button type="button" data-seats="8">8人</button>
          <button type="button" data-seats="9">9人</button>
        </div>
      </div>
      <div class="row">
        <span class="label">ブラインド</span>
        <input type="number" inputmode="numeric" id="sb" value="3000" aria-label="SB">
        <span>/</span>
        <input type="number" inputmode="numeric" id="bb" value="6000" aria-label="BB">
      </div>
      <div class="row">
        <span class="label">アンティ</span>
        <div class="seg">
          <button type="button" data-ante="none">なし</button>
          <button type="button" data-ante="bb">BB</button>
          <button type="button" data-ante="all">各自</button>
        </div>
      </div>
      <div class="row" id="ante-row">
        <span class="label">アンティ額</span>
        <input type="number" inputmode="numeric" id="ante-amt" value="6000" aria-label="アンティ額">
        <span class="hint" id="ante-unit"></span>
      </div>
      <div class="row">
        <span class="label">有効スタック</span>
        <input type="number" inputmode="decimal" id="es" value="35" aria-label="有効スタック（BB）">
        <span>BB</span>
      </div>
    </div>
  </section>

  <!-- ② 自分（HERO）のポジションと手札 -->
  <section>
    <h2>HERO</h2>
    <div class="panel">
      <p class="hint warn" id="hero-warn">ポジションを選んでください。</p>
      <div class="pos" id="hero-pos"></div>
      <div class="row">
        <span class="label">手札</span>
        <div class="cards" id="hero-cards"></div>
      </div>
      <p class="hint">カードの枠を押すと、画面下でカードを選べます。</p>
    </div>
  </section>

  <!-- ③ ボード（フロップ3枚・ターン・リバー） -->
  <section>
    <h2>ボード</h2>
    <div class="panel">
      <div class="cards" id="board"></div>
      <p class="hint" id="board-hint"></p>
    </div>
  </section>

  <!-- ④ ショーダウン（相手の手札。ショーダウンになったときだけ出る） -->
  <section id="showdown-sec" hidden>
    <h2>ショーダウン</h2>
    <div class="panel" id="showdown"></div>
  </section>

  <!-- ⑤ アクション履歴 -->
  <section>
    <h2>アクション履歴</h2>
    <div class="panel log" id="log"></div>
  </section>

  <!-- ⑥ 記録テキスト（手書きと同じ書式で自動作成） -->
  <section>
    <h2>記録テキスト</h2>
    <div class="panel">
      <pre id="output"></pre>
      <div class="row">
        <button type="button" id="copy" class="primary">テキストをコピー</button>
        <button type="button" id="new-hand">新しいハンド</button>
        <span class="copy-msg" id="copy-msg"></span>
      </div>
    </div>
  </section>
</main>

<!-- 画面の下に固定：アクション入力 -->
<div class="pad" id="pad">
  <div class="pad-in">
    <div class="pad-top">
      <div class="turn" id="turn"></div>
      <div class="pad-btns">
        <button type="button" id="undo">1つ戻す</button>
        <button type="button" id="pad-toggle">たたむ ▼</button>
      </div>
    </div>
    <!-- 入力し忘れがあるときだけ出るボタン -->
    <div class="shortcuts" id="shortcuts"></div>
    <div class="pad-body" id="pad-body">
      <div class="who-row" id="who"></div>
      <div class="acts">
        <button type="button" data-act="f">フォールド</button>
        <button type="button" data-act="x">チェック</button>
        <button type="button" data-act="c" id="a-c">コール</button>
        <button type="button" data-act="b" class="aggr">ベット</button>
        <button type="button" data-act="r" class="aggr">レイズ</button>
      </div>
      <div class="sizes" id="sizes"></div>
      <div class="amount-row">
        <input type="number" inputmode="numeric" id="amount" aria-label="ベット・レイズの額">
        <span class="bb" id="amount-bb"></span>
        <button type="button" id="ok" class="primary">決定</button>
      </div>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<!-- 画面の下に固定：カード選択（カードの枠を押したときだけ出る） -->
<div class="pad" id="sheet" hidden>
  <div class="pad-in">
    <div class="pad-top">
      <div class="turn" id="sheet-title"></div>
      <button type="button" id="sheet-close">閉じる</button>
    </div>
    <!-- HEROの手札を選ぶときだけ、ポジションも選べるようにする -->
    <div class="sheet-pos-wrap" id="sheet-pos-wrap" hidden>
      <p class="hint" id="sheet-pos-hint"></p>
      <div class="sheet-pos" id="sheet-pos"></div>
    </div>
    <div class="ranks" id="ranks"></div>
    <div class="suits" id="suits"></div>
  </div>
</div>

<script>
// ============================================
// 1. 決まりごと（ポジション・カードの種類）
// ============================================

// 人数ごとのポジション（プリフロップで打つ順番）
const POSITIONS = {
  6: ['UTG', 'HJ', 'CO', 'BTN', 'SB', 'BB'],
  7: ['UTG', 'LJ', 'HJ', 'CO', 'BTN', 'SB', 'BB'],
  8: ['UTG', 'UTG1', 'LJ', 'HJ', 'CO', 'BTN', 'SB', 'BB'],
  9: ['UTG', 'UTG1', 'UTG2', 'LJ', 'HJ', 'CO', 'BTN', 'SB', 'BB'],
};
const RANKS = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
const SUITS = { s: '♠', h: '♥', d: '♦', c: '♣' };
const SUIT_MARK = { ...SUITS, x: '?' };  // x＝色（マーク）を忘れたとき
const ACT_NAME = { f: 'フォールド', x: 'チェック', c: 'コール', b: 'ベット', r: 'レイズ' };

// ストリート（0=プリフロップ、1=フロップ、2=ターン、3=リバー、4=ショーダウン）
const STREET_LABEL = ['PREFLOP', 'FLOP', 'TURN', 'RIVER'];
const STREET_TEXT = ['preflop', 'flop', 'turn', 'river'];   // 記録テキストの見出し（小文字）
const BOARD_OF_STREET = [[], [0, 1, 2], [3], [4]];          // 各ストリートで配られるボードの場所
const STREET_OF_BOARD = [1, 1, 1, 2, 3];                     // ボードの場所 → 何ストリート目か

// ============================================
// 2. 今の状態（アプリが覚えていること）
// ============================================
const state = {
  seats: 9,           // 人数
  sb: 3000,           // スモールブラインド
  bb: 6000,           // ビッグブラインド
  anteType: 'bb',     // アンティの種類：'none'（なし）/'bb'（BBアンティ）/'all'（各自）
  ante: 6000,         // アンティ額（各自のときは1人あたり）
  es: 35,             // 有効スタック（BB単位）
  heroPos: null,      // 自分のポジション
  hero: [null, null], // 自分の手札（例：'Kh' は K♥）
  board: [null, null, null, null, null], // ボード5枚
  shows: {},          // ショーダウンで見えた相手の手札（例：{ BB: ['Qd', '6d'] }）
  mucks: {},          // ショーダウンでマックした相手（例：{ CO: true }）
  pick: 'h0',         // カードを入れる場所（'h0'・'h1'＝手札、'b0'〜'b4'＝ボード、's:BB:0'＝相手）。null＝選んでいない
  pickRank: null,     // カード選択中の数字
  actions: [],        // 入力したアクション（例：{street:1, pos:'HJ', type:'b', to:13000}）
  actor: null,        // 「誰が」で選んでいる人
  pending: null,      // ベット・レイズを押して額の入力待ちなら 'b' か 'r'
  amount: 0,          // 入力中の額
  message: '',        // 注意メッセージ
  padOpen: true,      // 画面下のアクション入力を開いているか
};

// 短く書くための道具
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('ja-JP');            // 12000 → "12,000"
const bbOf = chips => state.bb ? String(Math.round(chips / state.bb * 100) / 100) : '0'; // 12000 → "2"

// 早押しボタンの額を、きりのよい数字に丸める（BB 6000 なら 100 単位）
function roundChip(x) {
  const unit = state.bb >= 100 ? Math.pow(10, Math.floor(Math.log10(state.bb)) - 1) : 1;
  return Math.round(x / unit) * unit;
}

// ============================================
// 3. カードの出し入れ
// ============================================
function getCard(slot) {
  if (slot[0] === 'h') return state.hero[+slot[1]];
  if (slot[0] === 'b') return state.board[+slot[1]];
  const [, pos, i] = slot.split(':');
  return (state.shows[pos] || [])[+i] || null;
}

function setCard(slot, card) {
  if (slot[0] === 'h') state.hero[+slot[1]] = card;
  else if (slot[0] === 'b') state.board[+slot[1]] = card;
  else {
    const [, pos, i] = slot.split(':');
    if (!state.shows[pos]) state.shows[pos] = [null, null];
    state.shows[pos][+i] = card;
  }
}

// 使用中のカード（同じカードは2回選べない）
function usedCards() {
  return [...state.hero, ...state.board, ...Object.values(state.shows).flat()].filter(Boolean);
}

// 画面下のカード選択に出す名前
function slotName(slot) {
  if (slot[0] === 'h') return `HERO の手札 ${+slot[1] + 1}枚目`;
  if (slot[0] === 'b') {
    const i = +slot[1];
    return i < 3 ? `フロップ ${i + 1}枚目` : i === 3 ? 'ターン' : 'リバー';
  }
  const [, pos, i] = slot.split(':');
  return `${pos} の手札 ${+i + 1}枚目`;
}

// そのボードの場所は、もう入力してよいか（そのストリートまで進んでいるか）
function boardOpen(i, sim) {
  return STREET_OF_BOARD[i] <= Math.min(sim.street, 3);
}

// まだ入力していないボードの最初の場所（そのストリートまで進んでいるものだけ）
function firstEmptyBoard(sim) {
  const i = [0, 1, 2, 3, 4].find(k => !state.board[k] && boardOpen(k, sim));
  return i === undefined ? null : 'b' + i;
}

// カードを1枚入れたあと、同じまとまりの次の空いている場所
function nextSlot(slot, sim) {
  let group;
  if (slot[0] === 'h') group = ['h0', 'h1'];
  else if (slot[0] === 'b') group = [0, 1, 2, 3, 4].filter(i => boardOpen(i, sim)).map(i => 'b' + i);
  else { const pos = slot.split(':')[1]; group = [`s:${pos}:0`, `s:${pos}:1`]; }
  return group.find(s => !getCard(s)) || null;
}

// ============================================
// 4. 計算：入力したアクションを最初から順に再生して、
//    ポット・ストリート・次に打つ人などを求める
// ============================================
function simulate() {
  const list = POSITIONS[state.seats];
  const n = list.length;
  const stack = state.es * state.bb;  // 全員のスタックを有効スタックとみなす
  // put＝今のストリートで出している額、total＝前のストリートまでに出した額
  const players = list.map(pos => ({ pos, folded: false, allin: false, acted: false, put: 0, total: 0 }));
  const byPos = pos => players.find(p => p.pos === pos);

  // ブラインドとアンティ
  byPos('SB').put = Math.min(state.sb, stack);
  byPos('BB').put = Math.min(state.bb, stack);
  const anteTotal =
    state.anteType === 'none' ? 0 :
    state.anteType === 'bb' ? state.ante :
    state.ante * n;

  let street = 0;              // 今のストリート
  let currentBet = state.bb;   // 今のストリートで、いくらまで賭けられているか
  let next = 0;                // 次に打つ人の番号（プリフロップはUTG=0から）
  const potAt = [];            // 各ストリート開始時のポット
  const log = [];              // 履歴（自動のチェック・フォールドも含む）

  const pot = () => anteTotal + players.reduce((sum, p) => sum + p.total + p.put, 0);
  const alive = () => players.filter(p => !p.folded);
  // まだ打つ必要がある人か？（降りていない・オールインでない・まだ打っていない or 額が足りない）
  const needsToAct = p => !p.folded && !p.allin && (!p.acted || p.put < currentBet);
  const waitingList = () => {
    const w = [];
    for (let k = 0; k < n; k++) {
      const p = players[(next + k) % n];
      if (needsToAct(p)) w.push(p.pos);
    }
    return w;
  };
  // このストリートの賭けが終わったか
  const roundDone = () => {
    if (alive().length <= 1) return true;
    if (!waitingList().length) return true;
    // 打てる人が1人だけ（他は全員オールイン）で、額も足りていれば終わり
    const canAct = alive().filter(p => !p.allin);
    return canAct.length === 1 && canAct[0].put >= currentBet;
  };
  // 次のストリートへ進む
  const closeStreet = () => {
    players.forEach(p => { p.total += p.put; p.put = 0; p.acted = false; });
    currentBet = 0;
    street++;
    next = n - 2;  // フロップ以降はSBから
    if (street <= 3) potAt[street] = pot();
  };

  for (const a of state.actions) {
    while (street < a.street) closeStreet();
    const target = list.indexOf(a.pos);

    // 飛ばされた人：ベットに直面していればフォールド、そうでなければチェックとみなす
    for (let i = next; i !== target; i = (i + 1) % n) {
      const q = players[i];
      if (!needsToAct(q)) continue;
      if (q.put < currentBet) { q.folded = true; log.push({ street, pos: q.pos, type: 'f', auto: true }); }
      else { q.acted = true; log.push({ street, pos: q.pos, type: 'x', auto: true }); }
    }

    const p = players[target];
    const maxPut = stack - p.total;  // このストリートで出せる最大額
    if (a.type === 'f') p.folded = true;
    if (a.type === 'c') p.put = Math.min(currentBet, maxPut);
    if (a.type === 'b' || a.type === 'r') {
      p.put = Math.min(a.to, maxPut);
      currentBet = Math.max(currentBet, p.put);
      // ベット・レイズされたら、他の人はもう一度打つ必要がある
      players.forEach(q => { if (q !== p) q.acted = false; });
    }
    if (p.put >= maxPut) p.allin = true;
    p.acted = true;
    log.push({ ...a, to: p.put });
    next = (target + 1) % n;
  }

  // 賭けが終わっていれば、次のストリートへ（オールインならショーダウンまで一気に進む）
  while (alive().length > 1 && street < 4 && roundDone()) closeStreet();

  const alivePlayers = alive();
  const done = alivePlayers.length <= 1 || street === 4;  // ハンドが終わったか
  return {
    list, players, stack, street, currentBet, pot: pot(), potAt, log, done,
    alive: alivePlayers, waiting: done ? [] : waitingList(),
  };
}

// 今「誰が」で選ばれている人（選んでいなければ順番どおりの人）
function currentActor(sim) {
  return sim.waiting.includes(state.actor) ? state.actor : sim.waiting[0];
}

// ベット・レイズ額の早押しボタン
function presets(sim) {
  const bb = state.bb, cb = sim.currentBet;
  const p = sim.players.find(q => q.pos === currentActor(sim));
  const allin = sim.stack - p.total;
  if (sim.street === 0 && cb === bb) {
    // プリフロップで誰もレイズしていない（オープン）
    return [['2bb', 2 * bb], ['2.2bb', 2.2 * bb], ['2.5bb', 2.5 * bb], ['3bb', 3 * bb], ['オールイン', allin]];
  }
  if (cb === 0) {
    // フロップ以降で、まだ誰もベットしていない
    const pot = sim.pot;
    return [['1/3', roundChip(pot / 3)], ['1/2', roundChip(pot / 2)], ['2/3', roundChip(pot * 2 / 3)], ['ポット', pot], ['オールイン', allin]];
  }
  // 誰かがベット・レイズしている
  const potRaise = cb + (sim.pot + (cb - p.put));  // ポットサイズレイズ
  return [['×2.5', roundChip(2.5 * cb)], ['×3', 3 * cb], ['×4', 4 * cb], ['ポット', potRaise], ['オールイン', allin]]
    .map(([label, to]) => [label, Math.min(to, allin)]);
}

// ============================================
// 5. 記録テキストを作る（手書きと同じ書式）
// ============================================
function handText(a, b) {
  if (!a || !b) return '??';
  // 強い数字が先に来るように並べる
  // 同じ数字なら、色がわかっているカードを先にする
  const [x, y] = [a, b].sort((p, q) =>
    RANKS.indexOf(p[0]) - RANKS.indexOf(q[0]) || (p[1] === 'x') - (q[1] === 'x'));
  const ranks = x[0] + y[0];
  if (x[1] === 'x' && y[1] === 'x') return ranks;                 // 色が両方不明：例 KT
  if (x[1] === 'x' || y[1] === 'x') return `${ranks}(${x[1]}${y[1]})`;  // 片方不明：例 KT(hx)
  const kind = x[0] === y[0] ? '' : (x[1] === y[1] ? 's' : 'o');  // s=スーテッド、o=オフスート
  return `${ranks}${kind}(${x[1]}${y[1]})`;                        // 例：KTo(hd)
}

function tokenOf(a) {
  if (a.type === 'r' && a.street === 0) return `${bbOf(a.to)}bb r`;  // プリフロップのレイズは bb 表記
  if (a.type === 'r' || a.type === 'b') return `${a.type} ${Math.round(a.to)}`;  // 例：b 13000
  return a.type;                                                    // f / x / c
}

function boardText(street) {
  return BOARD_OF_STREET[street].map(i => state.board[i] || '??').join(' ');  // 例：Ad Kc 9d
}

function buildText(sim) {
  const lines = [];
  lines.push(`${state.sb}/${state.bb}(ES${state.es}BB)`);
  lines.push(`${state.heroPos || '??'} HERO ${handText(...state.hero)}`);
  lines.push('');

  for (let s = 0; s <= 3; s++) {
    if (s > 0) {
      if (sim.potAt[s] === undefined) break;  // まだそのストリートに進んでいない
      lines.push('', `${STREET_TEXT[s]}(${Math.round(sim.potAt[s])})`, boardText(s));
    }
    // 同じ人のアクションは1行にまとめる（例：BB x/r 40000）
    const order = [], tokens = {};
    for (const a of sim.log) {
      if (a.street !== s) continue;
      if (a.auto && a.type === 'f' && s === 0) continue;  // プリフロップの自動フォールドは書かない
      if (!tokens[a.pos]) { tokens[a.pos] = []; order.push(a.pos); }
      tokens[a.pos].push(tokenOf(a));
    }
    order.forEach(pos => lines.push(`${pos} ${tokens[pos].join('/')}`));
  }

  // ショーダウンで見えた相手の手札（例：BB Q6s(dd)、マックなら BB muck）
  if (sim.street === 4 && sim.alive.length > 1) {
    const shown = sim.alive
      .filter(p => p.pos !== state.heroPos)
      .map(p => {
        if (state.mucks[p.pos]) return `${p.pos} muck`;
        const c = state.shows[p.pos] || [];
        return c[0] && c[1] ? `${p.pos} ${handText(c[0], c[1])}` : null;
      })
      .filter(Boolean);
    if (shown.length) lines.push('', ...shown);
  }
  return lines.join('\n');
}

// ============================================
// 6. 画面を描き直す
// ============================================
function render() {
  const sim = simulate();

  // 上部
  const anteLabel = { none: 'アンティなし', bb: 'BBアンティ', all: '各自アンティ' }[state.anteType];
  $('summary').textContent = `${state.sb}/${state.bb} ・ ES${state.es}BB ・ ${state.seats}人 ・ ${anteLabel}`;
  $('pot').textContent = fmt(sim.pot);
  $('street').textContent =
    sim.alive.length <= 1 ? '終了' :
    sim.street === 4 ? 'SHOWDOWN' : STREET_LABEL[sim.street];

  // 卓の設定（押されているボタンに色をつける）
  document.querySelectorAll('[data-seats]').forEach(b => b.classList.toggle('on', +b.dataset.seats === state.seats));
  document.querySelectorAll('[data-ante]').forEach(b => b.classList.toggle('on', b.dataset.ante === state.anteType));
  $('ante-row').hidden = state.anteType === 'none';
  $('ante-unit').textContent = state.anteType === 'all' ? '1人あたり' : '';

  renderHero();
  renderBoard(sim);
  renderShowdown(sim);
  renderLog(sim);
  renderPad(sim);
  renderSheet();
  $('output').textContent = buildText(sim);
}

// カードの枠（押すと、画面下でそのカードを選べる）
function cardButton(slot, emptyLabel, disabled) {
  const c = getCard(slot);
  const target = slot === state.pick ? ' target' : '';
  const off = disabled ? ' disabled' : '';
  return c
    ? `<button type="button" class="card ${c[1]}${target}" data-slot="${slot}"${off}>${c[0]}<span>${SUIT_MARK[c[1]]}</span></button>`
    : `<button type="button" class="card empty${target}" data-slot="${slot}"${off}>${emptyLabel}</button>`;
}

function renderHero() {
  $('hero-pos').innerHTML = POSITIONS[state.seats]
    .map(p => `<button type="button" data-pos="${p}" class="${p === state.heroPos ? 'on' : ''}">${p}</button>`)
    .join('');
  $('hero-cards').innerHTML = cardButton('h0', '1枚目') + cardButton('h1', '2枚目');
  $('hero-warn').hidden = state.heroPos !== null;
}

function renderBoard(sim) {
  const names = ['flop', 'flop', 'flop', 'turn', 'river'];
  $('board').innerHTML = [0, 1, 2, 3, 4].map(i => {
    const gap = i === 3 || i === 4 ? '<div class="board-gap"></div>' : '';
    return gap + cardButton('b' + i, names[i], !boardOpen(i, sim) && !state.board[i]);
  }).join('');
  $('board-hint').textContent = sim.street === 0 && !sim.done
    ? 'プリフロップが終わると入力できます。'
    : 'カードの枠を押すと、画面下でカードを選べます。';
}

function renderShowdown(sim) {
  const show = sim.street === 4 && sim.alive.length > 1;
  $('showdown-sec').hidden = !show;
  if (!show) return;
  const warn = state.heroPos ? '' : '<p class="hint warn">HEROのポジションが未選択のため、自分も一覧に出ています。上の HERO でポジションを選んでください。</p>';
  $('showdown').innerHTML = warn + sim.alive
    .filter(p => p.pos !== state.heroPos)
    .map(p => {
      const muck = !!state.mucks[p.pos];
      // マックのときは、カードの枠を押せないようにする
      return `<div class="row"><span class="label pos-name">${p.pos}</span><div class="cards">`
        + cardButton(`s:${p.pos}:0`, '1枚目', muck) + cardButton(`s:${p.pos}:1`, '2枚目', muck)
        + `<button type="button" class="muck${muck ? ' on' : ''}" data-muck="${p.pos}">マック</button></div></div>`;
    })
    .join('') + '<p class="hint">相手が見せた手札を入れると、記録テキストに追加されます（入れなくても大丈夫です）。見せずに捨てたときは「マック」を押してください。</p>';
}

// ボードの小さな表示（例：A♦ K♣ 9♦）
function miniBoard(street) {
  return BOARD_OF_STREET[street].map(i => {
    const c = state.board[i];
    return c ? `<span class="${c[1]}">${c[0]}${SUIT_MARK[c[1]]}</span>` : '<span>?</span>';
  }).join(' ');
}

function renderLog(sim) {
  if (!sim.log.length) {
    $('log').innerHTML = '<p class="empty-log">まだアクションはありません。画面下の「誰が」で動いた人を選んでください。</p>';
    return;
  }
  let html = '';
  for (let s = 0; s <= Math.min(sim.street, 3); s++) {
    if (s > 0 && sim.potAt[s] === undefined) break;
    html += `<div class="log-head"><span>${STREET_LABEL[s]}${s > 0 ? `<span class="mini">${miniBoard(s)}</span>` : ''}</span>${s > 0 ? `<b>${fmt(sim.potAt[s])}</b>` : ''}</div>`;

    // 自動のチェック・フォールドは、続いている分をまとめて1行にする
    let autos = [], autoType = null;
    const flush = () => {
      if (autos.length) html += `<div class="act auto">${autos.join('・')} ${ACT_NAME[autoType]}</div>`;
      autos = []; autoType = null;
    };
    for (const a of sim.log) {
      if (a.street !== s) continue;
      if (a.auto) {
        if (autoType && autoType !== a.type) flush();
        autoType = a.type; autos.push(a.pos);
        continue;
      }
      flush();
      const hero = a.pos === state.heroPos ? ' hero' : '';
      const aggr = a.type === 'r' || a.type === 'b' ? ' aggr' : '';
      const amt =
        a.type === 'r' && s === 0 ? `${fmt(a.to)}（${bbOf(a.to)}bb）` :
        a.type === 'r' || a.type === 'b' || a.type === 'c' ? fmt(a.to) : '';
      html += `<div class="act"><span class="who${hero}">${a.pos}</span><span class="tag${aggr}">${ACT_NAME[a.type]}</span><span class="amt">${amt}</span></div>`;
    }
    flush();
  }
  $('log').innerHTML = html;
}

function renderPad(sim) {
  const picking = state.pick !== null;
  $('pad').hidden = picking;  // カード選択中は、アクション入力の代わりにカード選択を出す
  document.body.classList.toggle('pad-min', !picking && (sim.done || !state.padOpen));

  $('undo').disabled = state.actions.length === 0;
  $('msg').textContent = state.message;
  $('pad-body').hidden = sim.done || !state.padOpen;
  $('pad-toggle').hidden = sim.done;
  $('pad-toggle').textContent = state.padOpen ? 'たたむ ▼' : 'ひらく ▲';

  // 入力し忘れを知らせるボタン
  let sc = '';
  if (state.heroPos === null || state.hero.some(c => !c)) {
    sc += '<button type="button" class="need-hero" data-open="hero">HEROのポジション・手札を選ぶ</button>';
  }
  const boardSlot = firstEmptyBoard(sim);
  if (boardSlot) {
    const i = +boardSlot[1];
    const name = i < 3 ? 'フロップ' : i === 3 ? 'ターン' : 'リバー';
    sc += `<button type="button" class="need-board" data-open="board">ボードを入力（${name}）</button>`;
  }
  $('shortcuts').innerHTML = sc;

  if (sim.done) {
    if (sim.alive.length <= 1) {
      $('turn').innerHTML = `<b>${sim.alive[0].pos}</b>の勝ち（ポット ${fmt(sim.pot)}）`;
    } else {
      const boardLeft = state.board.some(c => !c);
      $('turn').innerHTML = boardLeft
        ? 'ショーダウン：残りのボードを入力してください'
        : 'ショーダウン：相手の手札を入力できます（任意）';
    }
    return;
  }

  const actor = currentActor(sim);
  const p = sim.players.find(q => q.pos === actor);
  const maxPut = sim.stack - p.total;
  const toCall = Math.min(sim.currentBet, maxPut) - p.put;
  $('turn').innerHTML = `${STREET_LABEL[sim.street]}：<b>${actor}</b>${actor === state.heroPos ? '（HERO）' : ''}の番です`;

  // 誰が（打つ可能性のある人を順番に並べる。後ろの人を押すと、間の人はチェックかフォールド扱い）
  $('who').innerHTML = '<span class="who-label">誰が</span>' + sim.waiting
    .map(pos => `<button type="button" data-actor="${pos}" class="${pos === actor ? 'on' : ''}">${pos}</button>`)
    .join('');

  // 押せるアクションだけ押せるようにする
  const canUse = {
    f: true,
    x: toCall <= 0,
    c: toCall > 0,
    b: sim.currentBet === 0,
    r: sim.currentBet > 0 && maxPut > sim.currentBet,
  };
  document.querySelectorAll('[data-act]').forEach(b => {
    b.disabled = !canUse[b.dataset.act];
    b.classList.toggle('pending', b.dataset.act === state.pending);
  });
  $('a-c').innerHTML = toCall > 0 ? `コール<small>${fmt(toCall)}</small>` : 'コール';

  // 額の早押しボタン
  $('sizes').innerHTML = presets(sim)
    .map(([label, to]) => `<button type="button" data-to="${Math.round(to)}">${label}</button>`)
    .join('');

  $('amount').disabled = !state.pending;
  $('ok').disabled = !state.pending;
  $('amount-bb').textContent = state.pending && state.amount ? `= ${bbOf(state.amount)}bb` : '';
}

function renderSheet() {
  const picking = state.pick !== null;
  $('sheet').hidden = !picking;
  if (!picking) return;
  $('sheet-title').innerHTML = `<b>${slotName(state.pick)}</b>：数字 → マークの順に押してください（色を忘れたら ?）`;

  // HEROの手札を選ぶときは、ポジションのボタンも並べる
  const heroPick = state.pick[0] === 'h';
  $('sheet-pos-wrap').hidden = !heroPick;
  if (heroPick) {
    const list = POSITIONS[state.seats];
    const need = state.heroPos === null;
    $('sheet-pos-wrap').classList.toggle('need', need);
    $('sheet-pos-hint').className = need ? 'hint warn' : 'hint';
    $('sheet-pos-hint').textContent = need ? 'HEROのポジションを選んでください' : 'HEROのポジション';
    $('sheet-pos').style.gridTemplateColumns = `repeat(${list.length}, 1fr)`;
    $('sheet-pos').innerHTML = list
      .map(p => `<button type="button" data-pos="${p}" class="${p === state.heroPos ? 'on' : ''}">${p}</button>`)
      .join('');
  }

  $('ranks').innerHTML = RANKS
    .map(r => `<button type="button" data-rank="${r}" class="${r === state.pickRank ? 'on' : ''}">${r}</button>`)
    .join('');

  // もう使っているカードは押せない（今選び直しているカードは除く）
  const current = getCard(state.pick);
  const used = usedCards().filter(c => c !== current);
  $('suits').innerHTML = Object.entries(SUITS).map(([s, mark]) => {
    const off = !state.pickRank || used.includes(state.pickRank + s);
    return `<button type="button" data-suit="${s}" class="${s}"${off ? ' disabled' : ''}>${mark}</button>`;
  }).join('')
    // 色（マーク）を忘れたとき用
    + `<button type="button" data-suit="x" class="x"${state.pickRank ? '' : ' disabled'} aria-label="色不明">?</button>`;
}

// ============================================
// 7. ボタンを押したときの動き
// ============================================
function record(type, to) {
  const before = simulate();
  state.actions.push({ street: before.street, pos: currentActor(before), type, to });
  state.actor = null;
  state.pending = null;
  state.amount = 0;
  $('amount').value = '';
  state.message = '';

  // ストリートが進んだら、ボードのカード選択を自動で開く
  const after = simulate();
  if (after.street > before.street && after.alive.length > 1) {
    const slot = [0, 1, 2, 3, 4].map(i => 'b' + i).find(s => !getCard(s) && boardOpen(+s[1], after));
    if (slot) { state.pick = slot; state.pickRank = null; }
  }
}

function setAmount(to) {
  state.amount = to;
  $('amount').value = to;
}

function doAction(type) {
  const sim = simulate();
  state.message = '';
  if (type === 'b' || type === 'r') {
    // ベット・レイズは、額を選んでから「決定」
    state.pending = type;
    if (!(state.amount > sim.currentBet)) setAmount(Math.round(presets(sim)[0][1]));
    return;
  }
  record(type);
}

function confirmAmount() {
  const sim = simulate();
  const p = sim.players.find(q => q.pos === currentActor(sim));
  const maxPut = sim.stack - p.total;
  const to = Math.round(state.amount);
  if (!(to > sim.currentBet)) {
    state.message = `今のベット額（${fmt(sim.currentBet)}）より大きい額を入れてください。`;
  } else if (to > maxPut) {
    state.message = `残りのスタック（${fmt(maxPut)}）以下の額にしてください。`;
  } else {
    record(state.pending, to);
  }
}

function pickSuit(s) {
  setCard(state.pick, state.pickRank + s);
  state.pickRank = null;
  state.pick = nextSlot(state.pick, simulate());  // 次の空いている場所へ。なければ閉じる
}

function clearHand() {
  Object.assign(state, {
    board: [null, null, null, null, null], shows: {}, mucks: {},
    actions: [], actor: null, pending: null, amount: 0, message: '',
  });
  $('amount').value = '';
}

function changeSeats(n) {
  if (n === state.seats) return;
  if (state.actions.length && !confirm('人数を変えると、入力したアクションとボードが消えます。よろしいですか？')) return;
  state.seats = n;
  clearHand();
  if (!POSITIONS[n].includes(state.heroPos)) state.heroPos = null;
}

// 次のハンドのHEROのポジション（ボタンが1つ動くので、1つ前のポジションになる。UTG の次は BB）
function nextHeroPos() {
  const list = POSITIONS[state.seats];
  const i = list.indexOf(state.heroPos);
  return i === -1 ? null : list[(i - 1 + list.length) % list.length];
}

function newHand() {
  const hasData = state.actions.length || usedCards().length;
  const nextPos = nextHeroPos();
  const note = nextPos ? `\n（HEROのポジションは ${nextPos} になります）` : '';
  if (hasData && !confirm('今のハンドを消して、新しいハンドを始めますか？' + note)) return;
  clearHand();
  Object.assign(state, { heroPos: nextPos, hero: [null, null], pick: 'h0', pickRank: null, padOpen: true });
  $('copy-msg').textContent = '';
}

async function copyText() {
  const text = $('output').textContent;
  try {
    await navigator.clipboard.writeText(text);
    $('copy-msg').textContent = 'コピーしました';
  } catch (err) {
    // コピーできない環境では、文字を選択状態にする
    const range = document.createRange();
    range.selectNodeContents($('output'));
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    $('copy-msg').textContent = '文字を選択しました。長押しでコピーしてください';
  }
}

// ボタンが押されたら、どのボタンかを見分けて処理する
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const d = b.dataset;

  if (b.id === 'copy') { copyText(); return; }  // コピーは画面を描き直さない

  if (d.seats) changeSeats(+d.seats);
  else if (d.ante) {
    state.anteType = d.ante;
    if (d.ante === 'bb') { state.ante = state.bb; $('ante-amt').value = state.bb; }
  }
  else if (d.pos) state.heroPos = d.pos;  // もう一度押しても選択は外れない
  else if (d.slot) { state.pick = d.slot; state.pickRank = null; }
  else if (d.open) {
    // 入力し忘れボタン：HEROの手札（空いている方）か、ボードの空いている場所を開く
    state.pick = d.open === 'hero'
      ? (state.hero[0] ? (state.hero[1] ? 'h0' : 'h1') : 'h0')
      : firstEmptyBoard(simulate());
    state.pickRank = null;
  }
  else if (d.muck) {
    // マックの切り替え（マックにしたら、入れていたカードは消す）
    state.mucks[d.muck] = !state.mucks[d.muck];
    if (state.mucks[d.muck]) { delete state.shows[d.muck]; state.pick = null; }
  }
  else if (d.rank) state.pickRank = d.rank;
  else if (d.suit) pickSuit(d.suit);
  else if (b.id === 'sheet-close') { state.pick = null; state.pickRank = null; }
  else if (b.id === 'pad-toggle') state.padOpen = !state.padOpen;
  else if (d.actor) { state.actor = d.actor; state.pending = null; state.message = ''; }
  else if (d.act) doAction(d.act);
  else if (d.to) {
    // 早押しボタン：ベット／レイズを選んだ状態にして額を入れる
    state.pending = simulate().currentBet === 0 ? 'b' : 'r';
    setAmount(+d.to);
  }
  else if (b.id === 'ok') confirmAmount();
  else if (b.id === 'undo') {
    state.actions.pop();
    Object.assign(state, { actor: null, pending: null, message: '', pick: null, pickRank: null });
  }
  else if (b.id === 'new-hand') newHand();
  else return;

  render();
});

// 数字の入力欄が変わったとき
// SBを入れたら、BBにはその2倍を自動で入れる（1000/1500 などのときは、BBを手で直す）
$('sb').addEventListener('input', e => {
  state.sb = +e.target.value || 0;
  state.bb = state.sb * 2;
  $('bb').value = state.bb;
  if (state.anteType === 'bb') { state.ante = state.bb; $('ante-amt').value = state.bb; }
  render();
});
$('bb').addEventListener('input', e => {
  state.bb = +e.target.value || 0;
  if (state.anteType === 'bb') { state.ante = state.bb; $('ante-amt').value = state.bb; }
  render();
});
$('ante-amt').addEventListener('input', e => { state.ante = +e.target.value || 0; render(); });
$('es').addEventListener('input', e => { state.es = +e.target.value || 0; render(); });
$('amount').addEventListener('input', e => { state.amount = +e.target.value || 0; state.message = ''; render(); });

// 最初の表示
render();
</script>
</body>
</html>
