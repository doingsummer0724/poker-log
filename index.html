<!doctype html>
<html lang="ja">
<head>
<!-- 文字化けを防ぐ設定 -->
<meta charset="utf-8">
<!-- スマホの画面幅に合わせて表示する設定 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホールデム ハンドログ</title>
<!-- 文字の見た目（フォント）を読み込む -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  /* ============================================
     色の設定（明るいテーマ）
     ============================================ */
  :root {
    color-scheme: light;
    --bg: #eef2ef;          /* 背景 */
    --surface: #ffffff;     /* カードや枠の中 */
    --ink: #17211c;         /* 文字 */
    --muted: #5f6d66;       /* 薄い文字 */
    --line: #d5ddd8;        /* 区切り線 */
    --felt: #145c45;        /* 選択中（フェルトの緑） */
    --felt-soft: #dcebe4;   /* 選択中の薄い背景 */
    --aggr: #c0561e;        /* ベット・レイズ（攻めのアクション） */
    --aggr-ink: #ffffff;
    --warn: #b3261e;        /* 注意メッセージ */
    /* 4色デッキのスート色 */
    --spade: #17211c;
    --heart: #cf2f3b;
    --diamond: #1f63c6;
    --club: #2f8a3c;
    --font-jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    --font-num: "Barlow Condensed", "Arial Narrow", sans-serif;
    --font-mono: "JetBrains Mono", "Consolas", monospace;
  }

  /* 色の設定（暗いテーマ：スマホがダークモードのとき） */
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0e1411; --surface: #18211c; --ink: #e5ece8; --muted: #9aa8a0;
      --line: #2a3630; --felt: #4fbf8a; --felt-soft: #1d3a2d;
      --aggr: #e8793c; --aggr-ink: #1a0f08; --warn: #ff8a80;
      --spade: #e5ece8; --heart: #ff6b76; --diamond: #6aa5ff; --club: #5fcf6e;
    }
  }

  /* ============================================
     全体のレイアウト
     ============================================ */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-jp);
    font-size: 15px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 0 330px; /* 下に固定したボタン群に隠れないよう余白を取る */
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }

  /* 上部に固定：今のストリートとポット */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    margin-inline: -16px; padding: 10px 16px;
    background: var(--bg); border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  .street { font-family: var(--font-num); font-weight: 700; font-size: 22px; letter-spacing: .06em; }
  .blinds { color: var(--muted); font-size: 13px; }
  .pot { font-family: var(--font-num); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pot small { font-size: 13px; color: var(--muted); font-family: var(--font-jp); font-weight: 500; margin-right: 4px; }

  .note {
    font-size: 12.5px; color: var(--muted); margin: 0;
    border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px;
  }

  /* 各ブロック（設定・ヒーロー・ボード…） */
  section { display: grid; gap: 8px; }
  h2 {
    font-size: 12px; font-weight: 700; color: var(--muted);
    letter-spacing: .12em; margin: 0;
  }
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; display: grid; gap: 12px;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .label { font-size: 13px; color: var(--muted); min-width: 5.5em; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 0; }

  /* ボタンの基本形 */
  button {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px;
    min-height: 40px; padding: 0 12px; cursor: pointer;
  }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--felt); outline-offset: 2px; }
  button.on { background: var(--felt); border-color: var(--felt); color: var(--surface); font-weight: 700; }

  /* 選択肢を横に並べたボタン（人数・アンティ） */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); min-width: 3.2em; }
  .seg button:last-child { border-right: 0; }

  input[type="number"] {
    font-family: var(--font-num); font-size: 18px; font-variant-numeric: tabular-nums;
    width: 6.5em; min-height: 40px; padding: 0 8px;
    color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  input:disabled { opacity: .4; }

  /* ポジションのボタン */
  .pos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pos button { font-family: var(--font-num); font-size: 16px; font-weight: 600; padding: 0; }

  /* トランプのカード */
  .cards { display: flex; gap: 6px; flex-wrap: wrap; }
  .card {
    width: 46px; height: 62px; border-radius: 7px;
    background: var(--surface); border: 1.5px solid var(--line);
    display: grid; place-items: center; line-height: 1;
    font-family: var(--font-num); font-weight: 700; font-size: 24px;
  }
  button.card { min-height: 62px; padding: 0; }
  .card span { display: block; font-size: 18px; margin-top: -4px; }
  .card.empty { border-style: dashed; color: var(--muted); font-size: 12px; font-family: var(--font-jp); font-weight: 500; }
  .card.target { border-color: var(--felt); box-shadow: 0 0 0 2px var(--felt); }
  .board-gap { width: 6px; }
  .s { color: var(--spade); } .h { color: var(--heart); } .d { color: var(--diamond); } .c { color: var(--club); }

  /* カードを選ぶボタン群 */
  .ranks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .ranks button { font-family: var(--font-num); font-size: 18px; font-weight: 600; padding: 0; }
  .suits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .suits button { font-size: 22px; }

  /* アクション履歴 */
  .log { display: grid; gap: 4px; }
  .log-head {
    display: flex; justify-content: space-between;
    font-family: var(--font-num); font-weight: 600; font-size: 15px; letter-spacing: .06em; color: var(--muted);
  }
  .act { display: flex; gap: 8px; align-items: baseline; font-variant-numeric: tabular-nums; }
  .act .who { font-family: var(--font-num); font-weight: 700; font-size: 16px; width: 3em; }
  .act .who.hero { color: var(--felt); }
  .act.auto { font-size: 12.5px; color: var(--muted); }
  .tag { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); }
  .tag.aggr { background: var(--aggr); border-color: var(--aggr); color: var(--aggr-ink); }
  .act .amt { font-family: var(--font-num); font-size: 16px; }
  .empty-log { margin: 0; font-size: 13px; color: var(--muted); }

  /* 記録テキスト（コピーする部分） */
  pre {
    margin: 0; padding: 12px; overflow-x: auto;
    font-family: var(--font-mono); font-size: 13px; line-height: 1.55;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  .primary { background: var(--felt); color: var(--surface); border-color: var(--felt); font-weight: 700; }
  .copy-msg { font-size: 12.5px; color: var(--felt); }

  /* ============================================
     画面の下に固定するアクション入力
     ============================================ */
  .pad {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 10px 16px 12px;
    box-shadow: 0 -6px 18px rgb(0 0 0 / .08);
  }
  .pad-in { max-width: 560px; margin: 0 auto; display: grid; gap: 8px; }
  .pad-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pad-top button { min-height: 34px; font-size: 13px; }
  .pad-btns { display: flex; gap: 6px; flex-shrink: 0; }
  /* アクション入力をたたんでいるときは、下の余白を小さくする */
  body.pad-min { padding-block-end: 90px; }
  .pad-body { display: grid; gap: 8px; }
  .turn { font-size: 13px; color: var(--muted); }
  .turn b { color: var(--ink); font-family: var(--font-num); font-size: 18px; margin-right: 4px; }
  .who-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .who-row .who-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .who-row button { min-height: 36px; padding: 0 9px; font-family: var(--font-num); font-size: 16px; font-weight: 600; }
  .acts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .acts button { min-height: 48px; font-weight: 700; padding: 0; font-size: 14px; line-height: 1.15; }
  .acts button small { display: block; font-family: var(--font-num); font-size: 13px; font-weight: 600; }
  .acts .aggr { background: var(--aggr); border-color: var(--aggr); color: var(--aggr-ink); }
  .acts .aggr.pending { box-shadow: 0 0 0 3px var(--ink); }
  .sizes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .sizes button { min-height: 36px; font-size: 13px; padding: 0; }
  .amount-row { display: flex; gap: 8px; align-items: center; }
  .amount-row input { flex: 1; width: auto; min-width: 0; }
  .amount-row .bb { font-family: var(--font-num); font-size: 15px; color: var(--muted); min-width: 4em; }
  .amount-row button { min-width: 5em; }
  .msg { font-size: 12.5px; color: var(--warn); min-height: 0; }
  .msg:empty { display: none; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- ============================================
     ここから画面の中身
     （中身の多くは、下の <script> が自動で書き込む）
     ============================================ -->

<!-- 上部：今のストリートとポット -->
<header class="topbar">
  <div>
    <div class="street" id="street">PREFLOP</div>
    <div class="blinds" id="summary"></div>
  </div>
  <div class="pot"><small>ポット</small><span id="pot">0</span></div>
</header>

<main class="wrap">
  <p class="note">Step 2：プリフロップの入力まで動きます。フロップ以降は Step 3 で追加します。</p>

  <!-- ① 卓の設定 -->
  <section>
    <h2>卓の設定</h2>
    <div class="panel">
      <div class="row">
        <span class="label">人数</span>
        <div class="seg">
          <button type="button" data-seats="6">6人</button>
          <button type="button" data-seats="7">7人</button>
          <button type="button" data-seats="8">8人</button>
          <button type="button" data-seats="9">9人</button>
        </div>
      </div>
      <div class="row">
        <span class="label">ブラインド</span>
        <input type="number" inputmode="numeric" id="sb" value="3000" aria-label="SB">
        <span>/</span>
        <input type="number" inputmode="numeric" id="bb" value="6000" aria-label="BB">
      </div>
      <div class="row">
        <span class="label">アンティ</span>
        <div class="seg">
          <button type="button" data-ante="none">なし</button>
          <button type="button" data-ante="bb">BB</button>
          <button type="button" data-ante="all">各自</button>
        </div>
      </div>
      <div class="row" id="ante-row">
        <span class="label">アンティ額</span>
        <input type="number" inputmode="numeric" id="ante-amt" value="6000" aria-label="アンティ額">
        <span class="hint" id="ante-unit"></span>
      </div>
      <div class="row">
        <span class="label">有効スタック</span>
        <input type="number" inputmode="decimal" id="es" value="35" aria-label="有効スタック（BB）">
        <span>BB</span>
      </div>
    </div>
  </section>

  <!-- ② 自分（HERO）のポジションと手札 -->
  <section>
    <h2>HERO</h2>
    <div class="panel">
      <div class="pos" id="hero-pos"></div>
      <div class="row">
        <span class="label">手札</span>
        <div class="cards" id="hero-cards"></div>
      </div>
      <p class="hint" id="pick-hint"></p>
      <!-- カードを選ぶボタン：数字 → マークの順に押す -->
      <div class="ranks" id="ranks"></div>
      <div class="suits" id="suits"></div>
    </div>
  </section>

  <!-- ③ ボード（Step 3 で入力できるようにする） -->
  <section>
    <h2>ボード</h2>
    <div class="panel">
      <div class="cards">
        <div class="card empty">flop</div>
        <div class="card empty">flop</div>
        <div class="card empty">flop</div>
        <div class="board-gap"></div>
        <div class="card empty">turn</div>
        <div class="board-gap"></div>
        <div class="card empty">river</div>
      </div>
      <p class="hint">Step 3 で入力できるようになります。</p>
    </div>
  </section>

  <!-- ④ アクション履歴 -->
  <section>
    <h2>アクション履歴</h2>
    <div class="panel log" id="log"></div>
  </section>

  <!-- ⑤ 記録テキスト（手書きと同じ書式で自動作成） -->
  <section>
    <h2>記録テキスト</h2>
    <div class="panel">
      <pre id="output"></pre>
      <div class="row">
        <button type="button" id="copy" class="primary">テキストをコピー</button>
        <button type="button" id="new-hand">新しいハンド</button>
        <span class="copy-msg" id="copy-msg"></span>
      </div>
    </div>
  </section>
</main>

<!-- 画面の下に固定：アクション入力 -->
<div class="pad">
  <div class="pad-in">
    <div class="pad-top">
      <div class="turn" id="turn"></div>
      <div class="pad-btns">
        <button type="button" id="undo">1つ戻す</button>
        <button type="button" id="pad-toggle">たたむ ▼</button>
      </div>
    </div>
    <div class="pad-body" id="pad-body">
      <div class="who-row" id="who"></div>
      <div class="acts">
        <button type="button" data-act="f">フォールド</button>
        <button type="button" data-act="x">チェック</button>
        <button type="button" data-act="c" id="a-c">コール</button>
        <button type="button" data-act="b" class="aggr">ベット</button>
        <button type="button" data-act="r" class="aggr">レイズ</button>
      </div>
      <div class="sizes" id="sizes"></div>
      <div class="amount-row">
        <input type="number" inputmode="numeric" id="amount" aria-label="ベット・レイズの額">
        <span class="bb" id="amount-bb"></span>
        <button type="button" id="ok" class="primary">決定</button>
      </div>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
// ============================================
// 1. 決まりごと（ポジション・カードの種類）
// ============================================

// 人数ごとのポジション（プリフロップで打つ順番）
const POSITIONS = {
  6: ['UTG', 'HJ', 'CO', 'BTN', 'SB', 'BB'],
  7: ['UTG', 'LJ', 'HJ', 'CO', 'BTN', 'SB', 'BB'],
  8: ['UTG', 'UTG1', 'LJ', 'HJ', 'CO', 'BTN', 'SB', 'BB'],
  9: ['UTG', 'UTG1', 'UTG2', 'LJ', 'HJ', 'CO', 'BTN', 'SB', 'BB'],
};
const RANKS = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
const SUITS = { s: '♠', h: '♥', d: '♦', c: '♣' };
const ACT_NAME = { f: 'フォールド', x: 'チェック', c: 'コール', b: 'ベット', r: 'レイズ' };

// ============================================
// 2. 今の状態（アプリが覚えていること）
// ============================================
const state = {
  seats: 9,           // 人数
  sb: 3000,           // スモールブラインド
  bb: 6000,           // ビッグブラインド
  anteType: 'bb',     // アンティの種類：'none'（なし）/'bb'（BBアンティ）/'all'（各自）
  ante: 6000,         // アンティ額（各自のときは1人あたり）
  es: 35,             // 有効スタック（BB単位）
  heroPos: null,      // 自分のポジション
  heroCards: [null, null], // 自分の手札（例：'Kh' は K♥）
  pickTarget: 0,      // 次にカードを入れる場所（0＝1枚目、1＝2枚目、null＝なし）
  pickRank: null,     // カード選択中の数字
  actions: [],        // 入力したアクション（例：{pos:'HJ', type:'r', to:12000}）
  actor: null,        // 「誰が」で選んでいる人
  pending: null,      // ベット・レイズを押して額の入力待ちなら 'b' か 'r'
  amount: 0,          // 入力中の額
  message: '',        // 注意メッセージ
  padOpen: true,      // 画面下のアクション入力を開いているか
};

// 短く書くための道具
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('ja-JP');            // 12000 → "12,000"
const bbOf = chips => state.bb ? String(Math.round(chips / state.bb * 100) / 100) : '0'; // 12000 → "2"

// ============================================
// 3. 計算：入力したアクションを最初から順に再生して、
//    ポット・次に打つ人などを求める
// ============================================
function simulate() {
  const list = POSITIONS[state.seats];
  const stack = state.es * state.bb;  // 全員のスタックを有効スタックとみなす
  const players = list.map(pos => ({ pos, folded: false, allin: false, acted: false, put: 0 }));
  const find = pos => players.find(p => p.pos === pos);

  // ブラインドを置く
  find('SB').put = state.sb;
  find('BB').put = state.bb;
  const anteTotal =
    state.anteType === 'none' ? 0 :
    state.anteType === 'bb' ? state.ante :
    state.ante * list.length;

  let currentBet = state.bb;  // 今いくらまで賭けられているか
  let next = 0;               // 次に打つ人の番号（UTG=0）
  const log = [];             // 履歴表示用（自動フォールドも含む）

  // まだ打つ必要がある人か？（降りていない・オールインでない・額が足りない or まだ打っていない）
  const needsToAct = p => !p.folded && !p.allin && (!p.acted || p.put < currentBet);

  for (const a of state.actions) {
    const target = list.indexOf(a.pos);

    // 案A：飛ばされた人はフォールドしたとみなす
    for (let i = next; i !== target; i = (i + 1) % list.length) {
      if (needsToAct(players[i])) {
        players[i].folded = true;
        log.push({ pos: players[i].pos, type: 'f', auto: true });
      }
    }

    const p = players[target];
    if (a.type === 'f') p.folded = true;
    if (a.type === 'c') p.put = Math.min(currentBet, stack);
    if (a.type === 'r' || a.type === 'b') {
      p.put = a.to;
      currentBet = a.to;
      // レイズされたら、他の人はもう一度打つ必要がある
      players.forEach(q => { if (q !== p) q.acted = false; });
    }
    if (p.put >= stack) p.allin = true;
    p.acted = true;
    log.push({ ...a, to: p.put });
    next = (target + 1) % list.length;
  }

  // 次に打てる人を、順番どおりに並べる
  const waiting = [];
  for (let k = 0; k < list.length; k++) {
    const p = players[(next + k) % list.length];
    if (needsToAct(p)) waiting.push(p.pos);
  }
  const alive = players.filter(p => !p.folded);
  const done = alive.length <= 1 || waiting.length === 0;  // プリフロップが終わったか
  const pot = anteTotal + players.reduce((sum, p) => sum + p.put, 0);

  return { list, players, stack, currentBet, pot, waiting, alive, done, log };
}

// 今「誰が」で選ばれている人（選んでいなければ順番どおりの人）
function currentActor(sim) {
  return sim.waiting.includes(state.actor) ? state.actor : sim.waiting[0];
}

// ベット・レイズ額の早押しボタン
function presets(sim) {
  const bb = state.bb, cb = sim.currentBet;
  if (cb === bb) {
    // 誰もレイズしていない（オープン）
    return [['2bb', 2 * bb], ['2.2bb', 2.2 * bb], ['2.5bb', 2.5 * bb], ['3bb', 3 * bb], ['オールイン', sim.stack]];
  }
  // 誰かがレイズしている（3ベット以降）
  const p = sim.players.find(q => q.pos === currentActor(sim));
  const potRaise = cb + (sim.pot + (cb - p.put));  // ポットサイズレイズ
  return [['×2.5', 2.5 * cb], ['×3', 3 * cb], ['×4', 4 * cb], ['ポット', potRaise], ['オールイン', sim.stack]];
}

// ============================================
// 4. 記録テキストを作る（手書きと同じ書式）
// ============================================
function handText() {
  const [a, b] = state.heroCards;
  if (!a || !b) return '??';
  // 強い数字が先に来るように並べる
  const [x, y] = [a, b].sort((p, q) => RANKS.indexOf(p[0]) - RANKS.indexOf(q[0]));
  const kind = x[0] === y[0] ? '' : (x[1] === y[1] ? 's' : 'o');  // s=スーテッド、o=オフスート
  return `${x[0]}${y[0]}${kind}(${x[1]}${y[1]})`;                  // 例：KTo(hd)
}

function tokenOf(a) {
  if (a.type === 'r') return `${bbOf(a.to)}bb r`;  // プリフロップのレイズは bb 表記
  return a.type;                                   // f / x / c
}

function buildText(sim) {
  const lines = [];
  lines.push(`${state.sb}/${state.bb}(ES${state.es}BB)`);
  lines.push(`${state.heroPos || '??'} HERO ${handText()}`);
  lines.push('');

  // 同じ人のアクションは1行にまとめる（例：HJ 2bb r/c）
  const order = [], tokens = {};
  for (const a of state.actions) {
    if (!tokens[a.pos]) { tokens[a.pos] = []; order.push(a.pos); }
    tokens[a.pos].push(tokenOf(a));
  }
  order.forEach(pos => lines.push(`${pos} ${tokens[pos].join('/')}`));

  // プリフロップが終わって2人以上残っていれば、フロップのポットを書く
  if (sim.done && sim.alive.length > 1) lines.push('', `flop(${Math.round(sim.pot)})`);
  return lines.join('\n');
}

// ============================================
// 5. 画面を描き直す
// ============================================
function render() {
  const sim = simulate();

  // 上部
  const anteLabel = { none: 'アンティなし', bb: 'BBアンティ', all: '各自アンティ' }[state.anteType];
  $('summary').textContent = `${state.sb}/${state.bb} ・ ES${state.es}BB ・ ${state.seats}人 ・ ${anteLabel}`;
  $('pot').textContent = fmt(sim.pot);
  $('street').textContent = sim.done ? 'PREFLOP 終了' : 'PREFLOP';

  // 卓の設定（押されているボタンに色をつける）
  document.querySelectorAll('[data-seats]').forEach(b => b.classList.toggle('on', +b.dataset.seats === state.seats));
  document.querySelectorAll('[data-ante]').forEach(b => b.classList.toggle('on', b.dataset.ante === state.anteType));
  $('ante-row').hidden = state.anteType === 'none';
  $('ante-unit').textContent = state.anteType === 'all' ? '1人あたり' : '';

  renderHero();
  renderLog(sim);
  renderPad(sim);
  $('output').textContent = buildText(sim);
}

function renderHero() {
  // ポジション
  $('hero-pos').innerHTML = POSITIONS[state.seats]
    .map(p => `<button type="button" data-pos="${p}" class="${p === state.heroPos ? 'on' : ''}">${p}</button>`)
    .join('');

  // 手札（押すと、そのカードを選び直せる）
  $('hero-cards').innerHTML = state.heroCards.map((c, i) => {
    const target = i === state.pickTarget ? ' target' : '';
    return c
      ? `<button type="button" class="card ${c[1]}${target}" data-slot="${i}">${c[0]}<span>${SUITS[c[1]]}</span></button>`
      : `<button type="button" class="card empty${target}" data-slot="${i}">${i + 1}枚目</button>`;
  }).join('');

  $('pick-hint').textContent = state.pickTarget === null
    ? 'カードを押すと選び直せます。'
    : `${state.pickTarget + 1}枚目：数字 → マークの順に押してください。`;

  // 数字ボタン
  $('ranks').innerHTML = RANKS
    .map(r => `<button type="button" data-rank="${r}" class="${r === state.pickRank ? 'on' : ''}" ${state.pickTarget === null ? 'disabled' : ''}>${r}</button>`)
    .join('');

  // マークボタン（もう使っているカードは押せない）
  const used = state.heroCards.filter((c, i) => c && i !== state.pickTarget);
  $('suits').innerHTML = Object.entries(SUITS).map(([s, mark]) => {
    const off = !state.pickRank || used.includes(state.pickRank + s);
    return `<button type="button" data-suit="${s}" class="${s}" ${off ? 'disabled' : ''}>${mark}</button>`;
  }).join('');
}

function renderLog(sim) {
  if (!sim.log.length) {
    $('log').innerHTML = '<p class="empty-log">まだアクションはありません。画面下の「誰が」で動いた人を選んでください。</p>';
    return;
  }
  let html = '<div class="log-head"><span>PREFLOP</span></div>';
  let autos = [];
  // 自動フォールドの人はまとめて1行にする
  const flush = () => {
    if (autos.length) html += `<div class="act auto">${autos.join('・')} フォールド</div>`;
    autos = [];
  };
  for (const a of sim.log) {
    if (a.auto) { autos.push(a.pos); continue; }
    flush();
    const hero = a.pos === state.heroPos ? ' hero' : '';
    const aggr = a.type === 'r' || a.type === 'b' ? ' aggr' : '';
    const amt = a.type === 'r' ? `${fmt(a.to)}（${bbOf(a.to)}bb）` : a.type === 'c' ? fmt(a.to) : '';
    html += `<div class="act"><span class="who${hero}">${a.pos}</span><span class="tag${aggr}">${ACT_NAME[a.type]}</span><span class="amt">${amt}</span></div>`;
  }
  flush();
  $('log').innerHTML = html;
}

function renderPad(sim) {
  $('undo').disabled = state.actions.length === 0;
  $('msg').textContent = state.message;
  $('pad-body').hidden = sim.done || !state.padOpen;
  $('pad-toggle').hidden = sim.done;
  $('pad-toggle').textContent = state.padOpen ? 'たたむ ▼' : 'ひらく ▲';
  document.body.classList.toggle('pad-min', sim.done || !state.padOpen);

  if (sim.done) {
    $('turn').innerHTML = sim.alive.length === 1
      ? `<b>${sim.alive[0].pos}</b>の勝ち（ポット ${fmt(sim.pot)}）`
      : 'プリフロップ終了。フロップの入力は Step 3 で追加します。';
    return;
  }

  const actor = currentActor(sim);
  const p = sim.players.find(q => q.pos === actor);
  const toCall = sim.currentBet - p.put;
  $('turn').innerHTML = `<b>${actor}</b>${actor === state.heroPos ? '（HERO）' : ''}の番です`;

  // 誰が（打つ可能性のある人を順番に並べる。後ろの人を押すと、間の人はフォールド扱い）
  $('who').innerHTML = '<span class="who-label">誰が</span>' + sim.waiting
    .map(pos => `<button type="button" data-actor="${pos}" class="${pos === actor ? 'on' : ''}">${pos}</button>`)
    .join('');

  // 押せるアクションだけ押せるようにする
  const canUse = {
    f: true,
    x: toCall === 0,
    c: toCall > 0,
    b: sim.currentBet === 0,
    r: sim.currentBet > 0 && sim.stack > sim.currentBet,
  };
  document.querySelectorAll('[data-act]').forEach(b => {
    b.disabled = !canUse[b.dataset.act];
    b.classList.toggle('pending', b.dataset.act === state.pending);
  });
  $('a-c').innerHTML = toCall > 0 ? `コール<small>${fmt(Math.min(toCall, sim.stack - p.put))}</small>` : 'コール';

  // 額の早押しボタン
  $('sizes').innerHTML = presets(sim)
    .map(([label, to]) => `<button type="button" data-to="${Math.round(Math.min(to, sim.stack))}">${label}</button>`)
    .join('');

  $('amount').disabled = !state.pending;
  $('ok').disabled = !state.pending;
  $('amount-bb').textContent = state.pending && state.amount ? `= ${bbOf(state.amount)}bb` : '';
}

// ============================================
// 6. ボタンを押したときの動き
// ============================================
function record(type, to) {
  const sim = simulate();
  state.actions.push({ pos: currentActor(sim), type, to });
  state.actor = null;
  state.pending = null;
  state.amount = 0;
  $('amount').value = '';
  state.message = '';
}

function setAmount(to) {
  state.amount = to;
  $('amount').value = to;
}

function doAction(type) {
  const sim = simulate();
  state.message = '';
  if (type === 'b' || type === 'r') {
    // ベット・レイズは、額を選んでから「決定」
    state.pending = type;
    if (!(state.amount > sim.currentBet)) setAmount(Math.round(Math.min(presets(sim)[0][1], sim.stack)));
    return;
  }
  record(type);
}

function confirmAmount() {
  const sim = simulate();
  const to = Math.round(state.amount);
  if (!(to > sim.currentBet)) {
    state.message = `今のベット額（${fmt(sim.currentBet)}）より大きい額を入れてください。`;
  } else if (to > sim.stack) {
    state.message = `有効スタック（${fmt(sim.stack)}）以下の額にしてください。`;
  } else {
    record(state.pending, to);
  }
}

function pickSuit(s) {
  const i = state.pickTarget;
  state.heroCards[i] = state.pickRank + s;
  state.pickRank = null;
  // 次の空いている場所へ進む
  const empty = state.heroCards.findIndex(c => !c);
  state.pickTarget = empty === -1 ? null : empty;
}

function changeSeats(n) {
  if (n === state.seats) return;
  if (state.actions.length && !confirm('人数を変えると、入力したアクションが消えます。よろしいですか？')) return;
  state.seats = n;
  state.actions = [];
  state.actor = null;
  state.pending = null;
  if (!POSITIONS[n].includes(state.heroPos)) state.heroPos = null;
}

function newHand() {
  const hasData = state.actions.length || state.heroCards.some(c => c);
  if (hasData && !confirm('今のハンドを消して、新しいハンドを始めますか？')) return;
  Object.assign(state, {
    heroPos: null, heroCards: [null, null], pickTarget: 0, pickRank: null,
    actions: [], actor: null, pending: null, amount: 0, message: '',
  });
  $('amount').value = '';
  $('copy-msg').textContent = '';
}

async function copyText() {
  const text = $('output').textContent;
  try {
    await navigator.clipboard.writeText(text);
    $('copy-msg').textContent = 'コピーしました';
  } catch (err) {
    // コピーできない環境では、文字を選択状態にする
    const range = document.createRange();
    range.selectNodeContents($('output'));
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    $('copy-msg').textContent = '文字を選択しました。長押しでコピーしてください';
  }
}

// ボタンが押されたら、どのボタンかを見分けて処理する
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const d = b.dataset;

  if (b.id === 'copy') { copyText(); return; }  // コピーは画面を描き直さない

  if (d.seats) changeSeats(+d.seats);
  else if (d.ante) {
    state.anteType = d.ante;
    if (d.ante === 'bb') { state.ante = state.bb; $('ante-amt').value = state.bb; }
  }
  else if (d.pos) state.heroPos = d.pos;  // もう一度押しても選択は外れない
  // カードを選んでいる間は、画面下のアクション入力をたたむ
  else if (d.slot) { state.pickTarget = +d.slot; state.pickRank = null; state.padOpen = false; }
  else if (d.rank) { state.pickRank = d.rank; state.padOpen = false; }
  else if (d.suit) {
    pickSuit(d.suit);
    state.padOpen = state.pickTarget === null;  // 2枚そろったら、また開く
  }
  else if (b.id === 'pad-toggle') state.padOpen = !state.padOpen;
  else if (d.actor) { state.actor = d.actor; state.pending = null; state.message = ''; }
  else if (d.act) doAction(d.act);
  else if (d.to) {
    // 早押しボタン：ベット／レイズを選んだ状態にして額を入れる
    state.pending = simulate().currentBet === 0 ? 'b' : 'r';
    setAmount(+d.to);
  }
  else if (b.id === 'ok') confirmAmount();
  else if (b.id === 'undo') { state.actions.pop(); state.actor = null; state.pending = null; state.message = ''; }
  else if (b.id === 'new-hand') newHand();
  else return;

  render();
});

// 数字の入力欄が変わったとき
$('sb').addEventListener('input', e => { state.sb = +e.target.value || 0; render(); });
$('bb').addEventListener('input', e => {
  state.bb = +e.target.value || 0;
  if (state.anteType === 'bb') { state.ante = state.bb; $('ante-amt').value = state.bb; }
  render();
});
$('ante-amt').addEventListener('input', e => { state.ante = +e.target.value || 0; render(); });
$('es').addEventListener('input', e => { state.es = +e.target.value || 0; render(); });
$('amount').addEventListener('input', e => { state.amount = +e.target.value || 0; state.message = ''; render(); });

// 最初の表示
render();
</script>
</body>
</html>
